[project]
name = "stripe-integration-poc"
version = "0.1.0"
description = "Minimal Python examples of Stripe payment integrations"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "stripe>=12,<13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
